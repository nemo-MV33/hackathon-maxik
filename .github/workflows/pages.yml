name: Deploy mini app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['webapp/**', 'scripts/**', 'src/irnitu/**', 'src/services/**', '.github/workflows/pages.yml']
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Irkutsk
      IRNITU_API_TOKEN: ${{ secrets.INRTU_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: webapp
      - run: npm run build
        working-directory: webapp
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.API_URL }}
      - run: cp webapp/dist/index.html webapp/dist/404.html
      - name: Export IRNITU schedule
        if: ${{ env.IRNITU_API_TOKEN != '' }}
        run: npm run export:schedule -- webapp/dist/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
