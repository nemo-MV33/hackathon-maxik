openapi: 3.1.0
info:
  title: norfly API
  version: 0.2.0
  description: Профиль, расписание и домашние задания студента ИРНИТУ.
servers:
  - url: https://158-160-37-19.sslip.io
    description: Рабочий сервер (Yandex Cloud)
  - url: http://localhost:3000
    description: Запуск через Docker
security:
  - maxInitData: []
  - serviceKey: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      summary: Проверка состояния сервиса
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /api/me:
    get:
      operationId: getProfile
      summary: Профиль текущего пользователя
      responses:
        '200':
          description: Профиль MAX и учебные настройки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: updateProfile
      summary: Изменение группы, подгруппы, языка и уведомлений
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupId: { type: integer, minimum: 1 }
                subgroup: { type: [integer, 'null'], enum: [1, 2, null] }
                remindersEnabled: { type: boolean }
                lang: { type: string, enum: [ru, en] }
                notifications: { $ref: '#/components/schemas/NotificationsPatch' }
                onboarded: { type: boolean, description: Пользователь прошёл знакомство }
                muted: { type: boolean, description: Выключить все уведомления разом }
                reminderMinutes: { type: integer, enum: [5, 10, 15, 30], description: За сколько минут до пары напоминать }
                endMinutes: { type: integer, enum: [5, 10], description: За сколько минут до конца пары напоминать }
                summaryTime: { type: string, pattern: '^(1[6-9]|2[0-3]):(00|30)$', description: Время сводки на завтра по Иркутску }
                controls:
                  type: object
                  description: Формы контроля по дисциплинам; null удаляет отметку
                  additionalProperties: { type: [string, 'null'], enum: [exam, credit, graded_credit, coursework, none, null] }
      responses:
        '200':
          description: Профиль сохранён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteProfile
      summary: Удалить аккаунт
      description: Стирает профиль, настройки, личное ДЗ и напоминания, снимает роли старосты и редактора. Сообщения об опозданиях остаются в журнале группы.
      responses:
        '200':
          description: Аккаунт удалён
          content:
            application/json:
              schema: { type: object, required: [deleted], properties: { deleted: { type: boolean } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/absence/history:
    get:
      operationId: listAbsenceHistory
      summary: История опозданий
      description: Студенту — только свои сообщения. Старосте — ещё и «досье» по каждому студенту группы (минуты опоздания, пропуск пары = 90 минут), а с параметром student — подробности по одному студенту.
      parameters:
        - { name: student, in: query, required: false, schema: { type: integer } }
      responses:
        '200':
          description: История
          content:
            application/json:
              schema:
                type: object
                required: [role]
                properties:
                  role: { type: string, enum: [headman, student] }
                  mine: { type: array, items: { type: object } }
                  students:
                    type: array
                    items:
                      type: object
                      required: [id, name, totalMinutes, late, absent]
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        totalMinutes: { type: integer }
                        late: { type: integer }
                        absent: { type: integer }
                  student: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: У студента нет сообщений }
  /api/group/members:
    get:
      operationId: listGroupMembers
      summary: Одногруппники, которые пользуются ботом (только старосте)
      responses:
        '200':
          description: Список для выбора доверенного лица
          content:
            application/json:
              schema:
                type: object
                properties:
                  deputy: { type: [object, 'null'] }
                  members: { type: array, items: { type: object, properties: { userId: { type: integer }, name: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Доступно только старосте }
  /api/deputy:
    put:
      operationId: setDeputy
      summary: Кому уходят опоздания самого старосты
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [userId], properties: { userId: { type: [integer, 'null'] } } }
      responses:
        '200': { description: Сохранено }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Доступно только старосте }
  /api/announcements:
    get:
      operationId: listAnnouncements
      summary: Объявления старосты для группы пользователя
      responses:
        '200':
          description: Актуальные объявления; myRemindAt — время напоминания с учётом личной настройки
          content:
            application/json:
              schema:
                type: object
                required: [canPublish, items]
                properties:
                  canPublish: { type: boolean }
                  items: { type: array, items: { $ref: '#/components/schemas/Announcement' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createAnnouncement
      summary: Опубликовать объявление (староста)
      description: Бот отправляет объявление в чат группы и каждому одногруппнику в личку.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 1500 }
                remindAt: { type: [string, 'null'], format: date-time }
      responses:
        '200': { description: 'Опубликовано, postedToChat — удалось ли написать в чат группы' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Публикует только староста }
  /api/announcements/{id}:
    delete:
      operationId: deleteAnnouncement
      summary: Удалить объявление (староста)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Удалено }
        '403': { description: Удаляет только староста }
        '404': { description: Не найдено }
  /api/announcements/{id}/reminder:
    put:
      operationId: setAnnouncementReminder
      summary: Своё время напоминания об объявлении
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, required: [remindAt], properties: { remindAt: { type: [string, 'null'], format: date-time } } }
                - { type: object, required: [reset], properties: { reset: { const: true } } }
      responses:
        '200': { description: Сохранено }
        '404': { description: Не найдено }
  /api/absence:
    get:
      operationId: listAbsences
      summary: Сообщения об опоздании за день
      description: Старосте — все сообщения его группы с именами, студенту — только свои.
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
      responses:
        '200':
          description: Сообщения и статус «принято»
          content:
            application/json:
              schema:
                type: object
                required: [role, date, items]
                properties:
                  role: { type: string, enum: [headman, student] }
                  date: { type: string, format: date }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, kind, createdAt, acceptedAt]
                      properties:
                        id: { type: string }
                        kind: { type: string, enum: [late, absent] }
                        senderName: { type: [string, 'null'] }
                        reason: { type: [string, 'null'] }
                        text: { type: [string, 'null'] }
                        lesson: { type: [object, 'null'] }
                        createdAt: { type: string, format: date-time }
                        acceptedAt: { type: [string, 'null'], format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: reportAbsence
      summary: Сообщить старосте об опоздании или отсутствии
      description: Бот отправляет старосте группы личное сообщение с именем студента, парой и причиной.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [late, absent] }
                reason:
                  type: string
                  enum: [late10, late20, transport, ill, family, certificate]
                  description: Готовая причина. late10, late20, transport — для late; ill, family, certificate — для absent
                text: { type: string, maxLength: 500, description: 'Своя причина, если reason не указан' }
                lessonDate: { type: string, format: date }
                lessonNumber: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Сообщение отправлено или ждёт, пока староста откроет бота
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [sent, pending] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Пара не найдена в расписании ИРНИТУ }
        '409': { description: Группа не выбрана или у группы нет старосты в боте }
  /api/homework:
    get:
      operationId: listHomework
      summary: Общие и личные ДЗ текущего студента
      parameters:
        - in: query
          name: groupId
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          description: ДЗ выбранной группы с личными версиями
          content:
            application/json:
              schema:
                type: object
                required: [group, role, canEditShared, period, items]
                properties:
                  group: { $ref: '#/components/schemas/Group' }
                  role: { type: string, enum: [headman, editor, member, student] }
                  canEditShared: { type: boolean }
                  period:
                    type: object
                    required: [from, to]
                    properties:
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Homework' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Учебная группа не выбрана
    put:
      operationId: saveHomework
      summary: Запись, обновление или сброс ДЗ
      description: Общее ДЗ могут менять староста и редакторы. Личное ДЗ доступно только его владельцу.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, lessonNumber, subgroup, scope]
              properties:
                date: { type: string, format: date }
                lessonNumber: { type: integer, minimum: 1 }
                subgroup: { type: [integer, 'null'], enum: [1, 2, null] }
                text: { type: [string, 'null'], maxLength: 2000, description: null удаляет версию }
                scope: { type: string, enum: [shared, personal, reminder], description: 'reminder — только личное напоминание, text не нужен' }
                remindAt: { type: [string, 'null'], format: date-time, description: Личное напоминание о ДЗ; null снимает }
      responses:
        '200':
          description: ДЗ сохранено или удалено
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Нет прав на изменение общего ДЗ
        '404':
          description: Пара не найдена в расписании ИРНИТУ
  /api/institutes:
    get:
      operationId: listInstitutes
      summary: Институты ИРНИТУ
      security: [{ serviceKey: [] }, { maxInitData: [] }]
      responses:
        '200':
          description: Список институтов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StringList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/groups:
    get:
      operationId: searchGroups
      summary: Поиск учебной группы
      security: [{ serviceKey: [] }, { maxInitData: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string }, example: истб-25 }
        - { name: institute, in: query, schema: { type: string } }
        - { name: course, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: Найденные группы
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, title]
                      properties:
                        id: { type: integer }
                        title: { type: string }
                        course: { type: integer }
                        institute: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/teachers:
    get:
      operationId: searchTeachers
      summary: Поиск преподавателя
      security: [{ serviceKey: [] }, { maxInitData: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: Найденные преподаватели
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auditories:
    get:
      operationId: searchAuditories
      summary: Поиск аудитории
      security: [{ serviceKey: [] }, { maxInitData: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: Найденные аудитории
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/schedule/{kind}/{id}:
    get:
      operationId: getSchedule
      summary: Расписание группы, преподавателя или аудитории на неделю
      security: [{ serviceKey: [] }, { maxInitData: [] }]
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [group, teacher, auditory] } }
        - { name: id, in: path, required: true, schema: { type: integer }, example: 478237 }
        - { name: week, in: query, description: Любая дата недели, schema: { type: string, format: date } }
        - { name: subgroup, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Пары за неделю
          content:
            application/json:
              schema:
                type: object
                required: [kind, entityId, period, weekEven, lessons]
                properties:
                  kind: { type: string }
                  entityId: { type: integer }
                  period:
                    type: object
                    required: [from, to]
                    properties:
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                  weekEven: { type: boolean }
                  lessons: { type: array, items: { type: object } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    serviceKey:
      type: http
      scheme: bearer
      description: Служебный ключ API_ACCESS_KEY для проверки справочников и расписания. Значение указано на первом слайде презентации.
    maxInitData:
      type: apiKey
      in: header
      name: Authorization
      description: "tma <initData MAX>"
  responses:
    Unauthorized:
      description: Подпись initData MAX не прошла проверку
    BadRequest:
      description: Некорректные параметры запроса
  schemas:
    StringList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { type: string } }
    ItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: integer }
    Group:
      type: object
      required: [id, title]
      properties:
        id: { type: integer }
        title: { type: string }
    Profile:
      type: object
      required: [group, institute, course, subgroup, remindersEnabled]
      properties:
        group: { anyOf: [{ $ref: '#/components/schemas/Group' }, { type: 'null' }] }
        institute: { type: [string, 'null'] }
        course: { type: [integer, 'null'] }
        subgroup: { type: [integer, 'null'], enum: [1, 2, null] }
        remindersEnabled: { type: boolean }
        lang: { type: [string, 'null'], enum: [ru, en, null], description: 'Язык, выбранный в боте или приложении' }
        notifications: { $ref: '#/components/schemas/Notifications' }
        onboarded: { type: boolean }
    Notifications:
      type: object
      description: Уведомления в личный чат с ботом
      required: [summary, homework, changes, exams, announcements, lessonEnd]
      properties:
        exams: { type: boolean, description: Экзамены и зачёты за 3 дня и накануне }
        announcements: { type: boolean, description: Объявления старосты и напоминания по ним }
        lessonEnd: { type: boolean, description: Напоминание перед концом пары (по умолчанию выключено) }
        summary: { type: boolean, description: Сводка на завтра во время summaryTime }
        homework: { type: boolean, description: Новое или изменённое ДЗ группы }
        changes: { type: boolean, description: 'Переносы, отмены и смена аудитории' }
    NotificationsPatch:
      type: object
      additionalProperties: false
      properties:
        summary: { type: boolean }
        homework: { type: boolean }
        changes: { type: boolean }
        exams: { type: boolean }
        announcements: { type: boolean }
        lessonEnd: { type: boolean }
    Announcement:
      type: object
      required: [id, text, remindAt, myRemindAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        remindAt: { type: [string, 'null'], format: date-time, description: Время старосты }
        myRemindAt: { type: [string, 'null'], format: date-time, description: Время с учётом личной настройки }
        customized: { type: boolean }
        authorName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        mine: { type: boolean }
    ProfileResponse:
      type: object
      required: [profile]
      properties:
        profile: { $ref: '#/components/schemas/Profile' }
    MeResponse:
      type: object
      required: [user, profile]
      properties:
        user:
          type: object
          required: [id]
          properties:
            id: { type: integer }
            firstName: { type: [string, 'null'] }
            lastName: { type: [string, 'null'] }
            username: { type: [string, 'null'] }
        profile: { $ref: '#/components/schemas/Profile' }
    Homework:
      type: object
      required: [groupId, date, lessonNumber, subgroup, subject, lessonTime, sharedText, personalText, text, source, updatedAt, version]
      properties:
        groupId: { type: integer }
        date: { type: string, format: date }
        lessonNumber: { type: integer }
        subgroup: { type: [integer, 'null'] }
        subject: { type: string }
        lessonTime: { type: string }
        sharedText: { type: [string, 'null'] }
        personalText: { type: [string, 'null'] }
        text: { type: string }
        source: { type: string, enum: [shared, personal] }
        updatedAt: { type: string, format: date-time }
        authorName: { type: [string, 'null'] }
        version: { type: integer, minimum: 1 }
