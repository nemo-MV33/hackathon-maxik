schemaVersion: '1.0'
solution: norfly
baseUrl: https://158-160-37-19.sslip.io
authentication:
  type: header
  name: Authorization
  roles:
    anonymous:
      description: Без заголовка авторизации.
    service:
      description: Служебный ключ API_ACCESS_KEY. Значение указано на первом слайде презентации.
      value: "Bearer <API_ACCESS_KEY>"
    student:
      description: >-
        Подписанные MAX initData в формате "tma <initData>". Их формирует клиент MAX при открытии
        мини-приложения из бота, поэтому личные методы (профиль, ДЗ, опоздания, объявления)
        проверяются через мини-приложение в MAX. Контракт этих методов описан в openapi.yaml.
checks:
  - name: health
    role: anonymous
    request:
      method: GET
      path: /health
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [status]
  - name: unauthorized-without-key
    role: anonymous
    request:
      method: GET
      path: /api/groups
      query:
        q: истб-25
    expected:
      statusCodes: [401]
      contentType: application/json
      requiredFields: [error]
  - name: institutes
    role: service
    request:
      method: GET
      path: /api/institutes
      headers:
        Authorization: "Bearer <API_ACCESS_KEY>"
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [items]
  - name: group-search
    role: service
    request:
      method: GET
      path: /api/groups
      query:
        q: истб-25
        limit: 5
      headers:
        Authorization: "Bearer <API_ACCESS_KEY>"
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [items, items[].id, items[].title]
  - name: teacher-search
    role: service
    request:
      method: GET
      path: /api/teachers
      query:
        q: Лукьянов
      headers:
        Authorization: "Bearer <API_ACCESS_KEY>"
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [items]
  - name: group-schedule
    role: service
    request:
      method: GET
      path: /api/schedule/group/478237
      query:
        week: '2026-09-28'
      headers:
        Authorization: "Bearer <API_ACCESS_KEY>"
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [kind, entityId, period, weekEven, lessons]
  - name: invalid-schedule-target
    role: service
    request:
      method: GET
      path: /api/schedule/building/1
      headers:
        Authorization: "Bearer <API_ACCESS_KEY>"
    expected:
      statusCodes: [400]
      contentType: application/json
      requiredFields: [error]
  - name: profile-requires-max-signature
    role: anonymous
    request:
      method: GET
      path: /api/me
    expected:
      statusCodes: [401]
      contentType: application/json
      requiredFields: [error]
