schemaVersion: '1.1'
solution: norfly
baseUrl: https://158-160-253-148.sslip.io
authentication:
  type: header
  name: Authorization
  roles:
    anonymous:
      description: Без заголовка авторизации.
    service:
      description: Служебный ключ API_ACCESS_KEY. Значение указано на первом слайде презентации.
      value: "Bearer <API_ACCESS_KEY>"
    student:
      description: >-
        Подписанные MAX initData в формате "tma <initData>". Их формирует клиент MAX при открытии
        мини-приложения из бота, поэтому личные методы (профиль, ДЗ, опоздания, объявления)
        проверяются через мини-приложение в MAX. Контракт этих методов описан в openapi.yaml.
checks:
  - name: universities
    role: service
    request:
      method: GET
      path: /api/universities
      headers: { Authorization: "Bearer <API_ACCESS_KEY>" }
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [items, "items[].id", "items[].timeZone", "items[].capabilities"]
  - name: bgu-group-search
    role: service
    request:
      method: GET
      path: /api/groups
      query: { universityId: bgu, q: ГМУ-25-1 }
      headers: { Authorization: "Bearer <API_ACCESS_KEY>" }
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [items, "items[].id", "items[].title"]
  - name: bgu-week
    role: service
    request:
      method: GET
      path: /api/schedule/group/bgu~32982
      query: { week: '2026-10-19' }
      headers: { Authorization: "Bearer <API_ACCESS_KEY>" }
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [universityId, timeZone, updatedAt, lessons, "lessons[].startsAt", "lessons[].endsAt"]
  - name: health
    role: anonymous
    request:
      method: GET
      path: /health
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [status]
  - name: unauthorized-without-key
    role: anonymous
    request:
      method: GET
      path: /api/groups
      query:
        q: истб-25
    expected:
      statusCodes: [401]
      contentType: application/json
      requiredFields: [error]
  - name: institutes
    role: service
    request:
      method: GET
      path: /api/institutes
      headers:
        Authorization: "Bearer <API_ACCESS_KEY>"
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [items]
  - name: group-search
    role: service
    request:
      method: GET
      path: /api/groups
      query:
        q: истб-25
        limit: 5
      headers:
        Authorization: "Bearer <API_ACCESS_KEY>"
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [items, "items[].id", "items[].title"]
  - name: teacher-search
    role: service
    request:
      method: GET
      path: /api/teachers
      query:
        q: Лукьянов
      headers:
        Authorization: "Bearer <API_ACCESS_KEY>"
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [items]
  - name: group-schedule
    role: service
    request:
      method: GET
      path: /api/schedule/group/irnitu~478237
      query:
        week: '2026-09-28'
      headers:
        Authorization: "Bearer <API_ACCESS_KEY>"
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [kind, entityId, period, weekEven, lessons]
  - name: invalid-schedule-target
    role: service
    request:
      method: GET
      path: /api/schedule/building/1
      headers:
        Authorization: "Bearer <API_ACCESS_KEY>"
    expected:
      statusCodes: [400]
      contentType: application/json
      requiredFields: [error]
  - name: profile-requires-max-signature
    role: anonymous
    request:
      method: GET
      path: /api/me
    expected:
      statusCodes: [401]
      contentType: application/json
      requiredFields: [error]

  - name: lesson-changes-require-max
    role: anonymous
    request:
      method: GET
      path: /api/lesson-changes
    expected:
      statusCodes: [401]
      contentType: application/json
      requiredFields: [error]
  - name: orphaned-homework-requires-max
    role: anonymous
    request:
      method: GET
      path: /api/homework/orphaned
    expected:
      statusCodes: [401]
      contentType: application/json
      requiredFields: [error]
  - name: mark-lesson-change-requires-max
    role: anonymous
    request:
      method: POST
      path: /api/lesson-changes
      body:
        from: { date: '2026-10-19', lessonNumber: 1, subgroup: null }
        to: null
    expected:
      statusCodes: [401]
      contentType: application/json
      requiredFields: [error]
  - name: revoke-lesson-change-requires-max
    role: anonymous
    request:
      method: DELETE
      path: /api/lesson-changes/example
    expected:
      statusCodes: [401]
      contentType: application/json
      requiredFields: [error]
  - name: rebind-orphaned-homework-requires-max
    role: anonymous
    request:
      method: PUT
      path: /api/homework/orphaned
      body:
        id: example
        to: { date: '2026-10-20', lessonNumber: 2, subgroup: null }
    expected:
      statusCodes: [401]
      contentType: application/json
      requiredFields: [error]
  - name: delete-orphaned-homework-requires-max
    role: anonymous
    request:
      method: DELETE
      path: /api/homework/orphaned
      body: { id: example }
    expected:
      statusCodes: [401]
      contentType: application/json
      requiredFields: [error]
# Личные методы проверяются с настоящими подписанными initData выбранной группы.
# POST /api/lesson-changes: {from: {date, lessonNumber, subgroup}, to: {date, lessonNumber, subgroup}|null}
# GET /api/lesson-changes: {items: [{id, groupId, from, to, status, authorName, at}]}
# DELETE /api/lesson-changes/{id}: отмена pending-отметки, права общего ДЗ.
# GET /api/homework/orphaned: {items: [...]}, староста или редактор.
# PUT /api/homework/orphaned: {id, to: {date, lessonNumber, subgroup}}, перепривязка.
# DELETE /api/homework/orphaned: {id}, удаление общего ДЗ без удаления личных версий.
# Все личные методы: Authorization: tma <initData>; служебный Bearer не заменяет роль.
# Расписание возвращает updatedAt, у ручной отметки пары — markedBy, markedAt, moveId.

# Составные id включают вуз: irnitu~478237 и bgu~32982. Числовые id входящих
# запросов совместимы с ИРНИТУ. week, lesson.date и ключи ДЗ — даты вуза.
# startsAt/endsAt — ISO-моменты. Отображение, сводка и тихие часы используют IANA
# из профиля; PUT /api/me принимает timeZone, quietHours и groupId.
