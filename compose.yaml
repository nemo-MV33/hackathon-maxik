services:
  norfly:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - norfly-data:/app/data
      - norfly-schedule:/app/webapp/dist/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  norfly-data:
  norfly-schedule:
